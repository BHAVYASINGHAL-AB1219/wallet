service: wallet-api
provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1 # Mumbai is best for you at NIT Sikkim
  environment:
    MONGODB_URI: ${env:MONGODB_URI} # Pulls from your .env file

functions:
  api:
    handler: index.handler # This matches your module.exports.handler
    events:
      - httpApi: '*' # Creates a single URL for all your Express routes
